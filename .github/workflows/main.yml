name: CI

on:
  pull_request:
  push:
    branches:
      - develop

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ${{ matrix.ros_distro }} (node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - noetic
          - humble
          - jazzy
          - lyrical
        node_version: [22, 24, 26]
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built here instead of by the test setup, so the layers are cached
      # across runs and shared by the jobs of each ROS distro
      - name: Build ROS test image
        uses: docker/build-push-action@v7
        with:
          context: packages/roslib
          build-args: ROS_DISTRO=${{ matrix.ros_distro }}
          tags: roslibjs-test:${{ matrix.ros_distro }}
          load: true
          cache-from: type=gha,scope=ros-test-${{ matrix.ros_distro }}
          # The jobs of a distro all export the same cache, only one can win
          cache-to: type=gha,mode=max,scope=ros-test-${{ matrix.ros_distro }},ignore-error=true

      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ matrix.node_version }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JavaScript library
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test --workspaces --if-present
        env:
          ROSLIB_SKIP_IMAGE_BUILD: 1

  docs:
    uses: ./.github/workflows/docs.yml
    secrets: inherit
    with:
      deploy: false
