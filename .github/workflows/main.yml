name: CI

on:
  pull_request:
  push:
    branches:
      - develop

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ${{ matrix.ros_distro }} (node ${{ matrix.node_version }}) (bson ${{ matrix.bson_only_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - noetic
          - humble
          - jazzy
          - kilted
        node_version: [20, 22, 24]
        bson_only_mode:
          - true
          - false
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      BSON_ONLY_MODE: ${{ matrix.bson_only_mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{ matrix.node_version }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JavaScript library
        run: npm run build

      - name: Run tests
        run: npm test
